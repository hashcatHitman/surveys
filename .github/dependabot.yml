version: 2

updates:
  - package-ecosystem: cargo
    groups:
      rust-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 1
    directory: /surveyhero
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    groups:
      python-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 1
    directory: /
    schedule:
      interval: daily
      time: "00:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: deps
